{% extends 'recipes/base.html' %}
{% block content %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="container mt-4">

<h2>📊 Dashboard</h2>

<div class="row text-center mb-4">
    <div class="col-md-3">
        <div class="card p-3 shadow-sm">🍽 Recipes<br><b>{{ total_recipes }}</b></div>
    </div>
    <div class="col-md-3">
        <div class="card p-3 shadow-sm">❤️ Likes<br><b>{{ total_likes }}</b></div>
    </div>
    <div class="col-md-3">
        <div class="card p-3 shadow-sm">⭐ Favorites<br><b>{{ total_favorites }}</b></div>
    </div>
    <div class="col-md-3">
        <div class="card p-3 shadow-sm">🔥 Calories<br><b>{{ total_calories }}</b></div>
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <canvas id="categoryChart"></canvas>
    </div>
    <div class="col-md-6">
        <canvas id="calorieChart"></canvas>
    </div>
</div>

</div>

<script>
const categories = {{ categories|safe }};

// Category chart
new Chart(document.getElementById('categoryChart'), {
    type: 'pie',
    data: {
        labels: Object.keys(categories),
        datasets: [{
            data: Object.values(categories)
        }]
    }
});

// Calories per day
fetch('/calories-data/?plan_id={{ request.user.mealplan_set.first.id }}')
.then(res => res.json())
.then(data => {
    new Chart(document.getElementById('calorieChart'), {
        type: 'bar',
        data: {
            labels: Object.keys(data),
            datasets: [{
                label: 'Calories',
                data: Object.values(data)
            }]
        }
    });
});
</script>

{% endblock %}
