<!DOCTYPE html>
<html>
<head>
    <title>CookMate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fb;
        }

        /* NAVBAR */
        .navbar-custom {
            background: #1e293b;
            padding: 10px 20px;
        }

        .navbar-custom .brand {
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .nav-btns a {
            margin-left: 8px;
        }

        /* CARDS */
        .card {
            border-radius: 12px;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        /* DARK MODE */
        .dark-mode {
            background-color: #121212;
            color: white;
        }

        .dark-mode .card {
            background-color: #1e1e1e;
            color: white;
        }

        .dark-mode a {
            color: #66b2ff;
        }

        /* NOTIFICATIONS */
        #notifBox {
            position: absolute;
            right: 20px;
            top: 60px;
            width: 300px;
            display: none;
            z-index: 999;
        }
    </style>
</head>

<body>

<!-- ✅ CLEAN NAVBAR -->
<nav class="navbar navbar-custom d-flex justify-content-between align-items-center">

    <div class="brand">🍳 CookMate</div>

    <div class="d-flex align-items-center nav-btns">

        <a href="/" class="btn btn-outline-light btn-sm">Home</a>
        <a href="/ai/" class="btn btn-warning btn-sm">AI</a>
        <a href="/add/" class="btn btn-success btn-sm">Add</a>

        <!-- 🔔 Notification -->
        <button onclick="toggleNotifications()" class="btn btn-dark btn-sm position-relative">
            🔔
            <span id="notifCount"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            </span>
        </button>

        <a href="/profile/" class="btn btn-info btn-sm">Profile</a>
        <a href="/logout/" class="btn btn-danger btn-sm">Logout</a>

        <button onclick="toggleDark()" class="btn btn-secondary btn-sm">🌙</button>

    </div>
</nav>

<!-- 🔔 Notification Box -->
<div id="notifBox" class="card shadow">
    <div class="card-body">
        <h6>Notifications</h6>
        <div id="notifList">Loading...</div>
    </div>
</div>

<!-- CONTENT -->
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<script>
function toggleDark() {
    document.body.classList.toggle("dark-mode");
    localStorage.setItem("dark", document.body.classList.contains("dark-mode"));
}

if (localStorage.getItem("dark") === "true") {
    document.body.classList.add("dark-mode");
}

function toggleNotifications(){
    let box = document.getElementById("notifBox");
    box.style.display = box.style.display === "none" ? "block" : "none";
}

function loadNotifications(){
    fetch("/notifications/")
    .then(res => res.json())
    .then(data => {

        let list = document.getElementById("notifList");
        let count = document.getElementById("notifCount");

        list.innerHTML = "";

        if(data.length === 0){
            list.innerHTML = "<p>No notifications</p>";
            count.innerText = "";
            return;
        }

        count.innerText = data.length;

        data.forEach(n => {
            list.innerHTML += `
                <div style="padding:5px; border-bottom:1px solid #eee;">
                    <b>${n.user}</b>: ${n.text}
                </div>`;
        });
    });
}

setInterval(loadNotifications, 10000);
window.onload = loadNotifications;
</script>

</body>
</html>
