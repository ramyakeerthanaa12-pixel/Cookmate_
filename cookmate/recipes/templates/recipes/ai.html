{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Recipe Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:linear-gradient(135deg,#eef2f7,#dbeafe);
            font-family:'Segoe UI',sans-serif;
            min-height:100vh;
        }

        .main-card{
            border-radius:20px;
            padding:30px;
            border:none;
            background:white;
        }

        #result{
            display:none;
            animation:fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(10px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .loader{
            display:none;
        }

        .result-box{
            background:#f8fafc;
            border-radius:12px;
            padding:15px;
            border:1px solid #e5e7eb;
        }

        .recipe-title{
            font-weight:700;
            color:#0f172a;
        }

        .badge-box{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }

        .custom-badge{
            background:#dbeafe;
            color:#1e3a8a;
            padding:8px 14px;
            border-radius:50px;
            font-size:14px;
            font-weight:600;
        }

        .save-btn{
            border-radius:12px;
            padding:12px;
            font-weight:600;
        }

        textarea{
            resize:none;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg main-card">

                <!-- TITLE -->
                <div class="text-center mb-4">

                    <h2 class="fw-bold">
                        🤖 AI Recipe Generator
                    </h2>

                    <p class="text-muted">
                        Generate smart recipes instantly using AI
                    </p>

                </div>

                <!-- INPUT -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Ingredients
                    </label>

                    <textarea
                        id="ingredients"
                        class="form-control"
                        rows="3"
                        placeholder="Example: chicken, rice, tomato, onion"></textarea>

                </div>

                <!-- BUTTON -->
                <button
                    onclick="getSuggestion()"
                    class="btn btn-success w-100 save-btn">

                    ✨ Generate Recipe

                </button>

                <!-- LOADER -->
                <div class="text-center mt-4 loader"
                     id="loader">

                    <div class="spinner-border text-primary"></div>

                    <p class="mt-3 fw-semibold">
                        AI is cooking something...
                    </p>

                </div>

                <!-- RESULT -->
                <div id="result" class="mt-5">

                    <h3 id="title"
                        class="recipe-title mb-3"></h3>

                    <!-- BADGES -->
                    <div class="badge-box mb-4">

                        <div class="custom-badge">

                            🍽 Category:
                            <span id="category"></span>

                        </div>

                        <div class="custom-badge">

                            🔥 Calories:
                            <span id="calories"></span>

                        </div>

                    </div>

                    <!-- INGREDIENTS -->
                    <div class="mb-4">

                        <h5 class="fw-bold mb-2">
                            🧂 Ingredients
                        </h5>

                        <div id="ing"
                             class="result-box"></div>

                    </div>

                    <!-- INSTRUCTIONS -->
                    <div class="mb-4">

                        <h5 class="fw-bold mb-2">
                            👨‍🍳 Instructions
                        </h5>

                        <div id="inst"
                             class="result-box"></div>

                    </div>

                    <!-- SAVE BUTTON -->
                    <button
                        onclick="saveRecipe()"
                        class="btn btn-primary w-100 save-btn">

                        💾 Save To My Recipes

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

/* =========================
   CSRF TOKEN
========================= */
function getCSRF(){
    let token = document.cookie
        .split(';')
        .find(c => c.trim().startsWith('csrftoken='));

    return token ? token.split('=')[1] : '';
}

/* =========================
   GLOBAL DATA
========================= */
let latestData = null;

/* =========================
   AI GENERATE
========================= */
window.getSuggestion = function(){

    let ingredients = document
        .getElementById("ingredients")
        .value.trim();

    if(!ingredients){
        alert("Please enter ingredients first!");
        return;
    }

    document.getElementById("loader").style.display = "block";
    document.getElementById("result").style.display = "none";

    fetch("/ai-recipe/", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": getCSRF()
        },
        body: new URLSearchParams({
            ingredients: ingredients
        })
    })

    .then(res => {
        if(!res.ok){
            throw new Error("Server Error");
        }
        return res.json();
    })

    .then(data => {

        console.log("AI DATA:", data);

        document.getElementById("loader").style.display = "none";
        document.getElementById("result").style.display = "block";

        /* ✅ IMPORTANT FIX */
        latestData = data;

        /* SAFE UI (NO undefined) */
        document.getElementById("title").innerText =
            data.title || "No Title";

        document.getElementById("category").innerText =
            data.category || "N/A";

        document.getElementById("calories").innerText =
            data.calories || "0";

        document.getElementById("ing").innerText =
            data.ingredients || "No ingredients";

        document.getElementById("inst").innerText =
            data.instructions || "No instructions";

    })

    .catch(err => {
        console.error("AI ERROR:", err);
        document.getElementById("loader").style.display = "none";
        alert("AI failed ❌");
    });

};


/* =========================
   SAVE RECIPE
========================= */
window.saveRecipe = function(){

    if(!latestData){
        alert("Generate recipe first!");
        return;
    }

    fetch("/save-ai-recipe/", {
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded",
            "X-CSRFToken": getCSRF()
        },
        body: new URLSearchParams({
            title: latestData.title,
            category: latestData.category,
            calories: latestData.calories,
            ingredients: latestData.ingredients,
            instructions: latestData.instructions
        })
    })

    .then(res => res.json())

    .then(data => {
        alert("Recipe saved successfully ✅");
    })

    .catch(err => {
        console.error(err);
        alert("Save failed ❌");
    });

};

</script>

</body>
</html>
